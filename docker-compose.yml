# ══════════════════════════════════════════════════════════════════════
#  NagarNetra — base profile
#  Everything a judge needs: `make up` → all healthy → `make demo`.
#
#  Every image is pinned to an explicit version. All tags verified to
#  publish linux/arm64 as well as linux/amd64, so this runs natively on
#  Apple Silicon and on x86 servers with no emulation.
#
#  The ai-worker is gated behind the `ai` profile below, Prometheus and
#  Grafana behind `monitoring`; the scale profile lives in
#  docker-compose.scale.yml.
# ══════════════════════════════════════════════════════════════════════

name: contrail

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:

  # ── PostgreSQL 16 + PostGIS 3.4 + TimescaleDB ───────────────────────
  # One image for both extensions. postgis/postgis has no arm64 build;
  # timescaledb-ha:*-all ships PostGIS and TimescaleDB together.
  postgres:
    image: timescale/timescaledb-ha:pg16.14-ts2.29.2-all
    container_name: contrail-postgres
    <<: *default-restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nagarnetra}
      POSTGRES_USER: ${POSTGRES_USER:-nagarnetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nagarnetra_dev_pw}
      # Enable both extensions at first boot
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - random_page_cost=1.1
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - timezone=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nagarnetra} -d ${POSTGRES_DB:-nagarnetra}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks: [contrail]

  # ── Redis 7 — cache + event bus (Streams w/ consumer groups) ────────
  redis:
    image: redis:7.4.11-alpine
    container_name: contrail-redis
    <<: *default-restart
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction        # never silently drop events off the bus
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging
    networks: [contrail]

  # ── MinIO — S3-compatible store for plate crops, frames, clips ──────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: contrail-minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nagarnetra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nagarnetra_dev_pw}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_HOST_PORT:-9001}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    networks: [contrail]

  # ── MinIO bucket bootstrap — creates the media bucket, then exits ───
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: contrail-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-nagarnetra} ${MINIO_ROOT_PASSWORD:-nagarnetra_dev_pw} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-nagarnetra-media} &&
      mc anonymous set none local/${MINIO_BUCKET:-nagarnetra-media} &&
      mc mb --ignore-existing local/${MINIO_PERSONS_BUCKET:-nagarnetra-persons} &&
      mc anonymous set none local/${MINIO_PERSONS_BUCKET:-nagarnetra-persons} &&
      echo 'minio buckets ready: ${MINIO_BUCKET:-nagarnetra-media}, ${MINIO_PERSONS_BUCKET:-nagarnetra-persons} (private)'
      "
    restart: "no"
    logging: *default-logging
    networks: [contrail]

  # ── OpenSearch — fuzzy/partial plate search ─────────────────────────
  # Apache-2.0. Postgres pg_trgm takes over at runtime if this is down,
  # so the demo survives losing this container (proven in Phase 8).
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    container_name: contrail-opensearch
    <<: *default-restart
    environment:
      discovery.type: single-node
      cluster.name: nagarnetra-search
      node.name: nagarnetra-os-01
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      # Local-only demo stack on an isolated bridge network; TLS and the
      # security plugin are configured for production in docs/SECURITY.md.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${OPENSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *default-logging
    networks: [contrail]

  # ── MediaMTX — RTSP in → WebRTC (WHEP) / HLS out ────────────────────
  # On-demand publishing: a camera is only pulled while someone watches.
  # That is a real bandwidth argument, not a demo trick (see docs/HLD.md).
  mediamtx:
    image: bluenviron/mediamtx:1.20.1-ffmpeg
    container_name: contrail-mediamtx
    <<: *default-restart
    environment:
      # `protocols` was renamed `rtspTransports` in MediaMTX 1.x.
      MTX_RTSPTRANSPORTS: tcp
      # Without an explicit host candidate, Docker Desktop's NAT hands the
      # browser ICE candidates it cannot reach and WebRTC silently fails.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_ADDITIONAL_HOSTS:-127.0.0.1}
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"       # RTSP
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"        # HLS
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"     # WebRTC / WHEP
      - "${MEDIAMTX_API_PORT:-9997}:9997"        # control API
      - "8189:8189/udp"                          # WebRTC ICE/UDP
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/videos:/videos:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9997/v3/paths/list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    networks: [contrail]

  # ── API — FastAPI: registry, GIS, auth, events, search, alerts ──────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        PYTHON_VERSION: "3.11"
        # The demo image doubles as the test/lint runner (`make test`,
        # `make lint`), so it carries pytest, ruff and mypy.
        INSTALL_DEV: "true"
    image: contrail/api:dev
    container_name: contrail-api
    <<: *default-restart
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nagarnetra}:${POSTGRES_PASSWORD:-nagarnetra_dev_pw}@postgres:5432/${POSTGRES_DB:-nagarnetra}
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: minio:9000
      MEDIAMTX_API_URL: http://mediamtx:9997
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Live reload during development; the image is self-contained without it.
      - ./services/api:/app/services/api
      - ./packages/contracts:/app/packages/contracts:ro
      # The AI worker's own image is deliberately minimal and carries no test
      # runner, so its tests run from here. They cover scheduling and
      # discovery, which need neither a model nor a camera.
      - ./services/ai-worker:/app/services/ai-worker
      # The pipeline library the worker imports, for the same reason, and the
      # face module the persons watchlist enrols with (`ailab.face`): the API
      # embeds a reference photo with the very code and weights the cameras
      # use, so both sides compute embeddings in one space. OpenCV is in this
      # image for that; onnxruntime is not, so the vehicle pipeline still
      # belongs in ai-lab's own suite.
      - ./ai-lab/ailab:/app/ai-lab/ailab:ro
      # YuNet + SFace weights for enrolment, fetched by
      # ai-lab/scripts/fetch_models.sh and never baked into an image.
      - ./ai-lab/models:/models:ro
      - ./services/simulator:/app/services/simulator
      - ./scripts:/app/scripts
      # End-to-end tests run from this image against the live stack.
      - ./tests:/app/tests
      - ./data/seed:/data/seed:ro
      # Writable: `make videos` transcodes fetched clips with the ffmpeg in
      # this image, so the host does not need ffmpeg installed.
      - ./data/videos:/data/videos
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks: [contrail]

  # ── Web — React command centre, served by nginx ─────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runtime
      args:
        NODE_VERSION: "20"
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/events}
    image: contrail/web:dev
    container_name: contrail-web
    <<: *default-restart
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
      # HTTPS, alongside the plain-HTTP demo address above (docs/SECURITY.md §6).
      - "${WEB_TLS_HOST_PORT:-8443}:8443"
    environment:
      # Extra names / addresses the generated self-signed certificate covers,
      # comma-separated — e.g. the laptop's LAN IP for a second screen. Ignored
      # when a certificate is mounted below.
      TLS_SERVER_NAMES: ${TLS_SERVER_NAMES:-}
      TLS_SERVER_IPS: ${TLS_SERVER_IPS:-}
    volumes:
      # cert.pem + key.pem here (e.g. from mkcert) are served as-is; otherwise a
      # self-signed pair is generated into it at start and reused after.
      # Gitignored.
      - ./infra/tls:/etc/nginx/tls
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks: [contrail]

  # ── Ingest — fleet health monitor ───────────────────────────────────
  # Runs the staggered probe loop against every camera through its VMS
  # adapter. A separate container so probing 80,000 cameras never competes
  # with serving operator requests, but the SAME image as the API: it shares
  # the ORM models and adapters, and one image build protects the 5-minute
  # demo (see CLAUDE.md section 9).
  ingest:
    image: contrail/api:dev
    container_name: contrail-ingest
    <<: *default-restart
    command: ["python", "-m", "app.ingest.monitor"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nagarnetra}:${POSTGRES_PASSWORD:-nagarnetra_dev_pw}@postgres:5432/${POSTGRES_DB:-nagarnetra}
      REDIS_URL: redis://redis:6379/0
      MEDIAMTX_API_URL: http://mediamtx:9997
    volumes:
      - ./services/api:/app/services/api
      - ./scripts:/app/scripts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The monitor has no HTTP surface. Liveness is proven by what it is FOR:
      # a recent row in camera_health. A process that is running but no longer
      # probing is not healthy, and a plain process check would miss that.
      test: ["CMD", "python", "-m", "app.ingest.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks: [contrail]

  # ── AI worker — live ANPR on camera streams ─────────────────────────
  # Pulls RTSP from MediaMTX, runs vehicle detection, tracking, plate
  # detection, OCR and multi-frame consensus, and publishes one event per
  # vehicle to Redis. It never writes to Postgres and never consults the
  # watchlist: the AI tier's job ends at "here is what I saw, and how sure I
  # am", and the API turns that into history and alerts.
  #
  # Cameras are split across workers by a stable hash of the camera code, so
  # scaling out is `--scale ai-worker=N` plus AI_WORKER_COUNT — no coordinator,
  # and two workers can never open the same stream.
  # ── One worker process per camera, on a deliberately small thread budget ──
  #
  # Measured on the 3-camera demo fleet, 8 physical cores / 14 vCPUs in the VM,
  # three 1080p15 RTSP streams, `stream_demo` config, ~2 minutes each:
  #
  #   processes  budget/process  fps per camera  p90 latency  CPU (all workers)
  #   1 (threads)     12 ÷ 3         1.5            ~1.0 s         12.2 cores
  #   3                4             0.8            ~2.0 s         14   cores
  #   3                3             1.5            ~1.0 s         11   cores
  #   3                2             1.7            ~0.95 s         8   cores  ← this
  #
  # The budget only governs the ONNX intra-op pools. RTSP decode and the OCR
  # engine's own sessions run threads outside it, so a "4-thread" process was
  # observed running 11 busy threads, and three of those on 8 cores spent more
  # time context-switching than inferring. Two per process is where throughput
  # peaks, and it leaves six vCPUs for MediaMTX and the browser rendering the
  # map — which is the difference between camera tiles that load and ones that
  # hang.
  #
  # Separate processes rather than threads in one worker because the pipeline's
  # Python-side work (letterbox, NMS, tracker, scheduler, OCR pre/post) holds
  # the GIL; one process is capped on that whatever the budget.
  #
  # Ownership is a hash shard of the registry roster: `make ai` runs one worker
  # owning every camera, `make ai-multi` runs three (AI_WORKER_COUNT=3) that
  # split the organisers' grid between them. AI_WORKER_CAMERAS_<n> can still
  # name a process's cameras explicitly; it narrows the roster, so each camera
  # keeps its resolved URL and plate regions. The three share one definition,
  # anchored below.
  ai-worker: &ai-worker
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    image: contrail/ai-worker:dev
    container_name: contrail-ai-worker
    <<: *default-restart
    profiles: ["ai"]
    # Time to close every capture before Docker kills the process. Killed, a
    # worker's grid sessions end without a TEARDOWN, which the integration
    # guide asks us not to do; its cameras stop together, within ~8s.
    stop_grace_period: 20s
    env_file: [.env]
    environment: &ai-worker-env
      # An explicit camera list for this process; empty means its hash shard.
      AI_WORKER_CAMERAS: ${AI_WORKER_CAMERAS_1:-}
      REDIS_URL: redis://redis:6379/0
      EVENT_STREAM_KEY: nagarnetra:events:detections
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HOST: mediamtx
      AI_CONFIG: stream
      AI_MODELS_DIR: /models
      # The registry is the source of truth for which cameras exist: it lists
      # the organisers' federated grid and our own cameras alike, and keeps
      # listing a federated camera while its gateway is down. "sandbox" reads
      # the grid's catalogue directly; "mediamtx" only sees our own gateway.
      AI_WORKER_SOURCE: ${AI_WORKER_SOURCE:-registry}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-https://cctv.corp8.cloud}
      SANDBOX_MEDIA_HOST: ${SANDBOX_MEDIA_HOST:-103.250.160.189}
      # From .env, which is gitignored. Empty means anonymous access.
      SANDBOX_RTSP_USERNAME: ${SANDBOX_RTSP_USERNAME:-}
      SANDBOX_RTSP_PASSWORD: ${SANDBOX_RTSP_PASSWORD:-}
      AI_WORKER_INDEX: "0"
      AI_WORKER_COUNT: ${AI_WORKER_COUNT:-1}
      # Inference slots: how many of this worker's cameras are analysed at
      # once. Every camera it owns keeps its stream open whatever this is —
      # the organisers' grid refuses our login when streams are opened and
      # closed every few minutes — and the slots rotate among the open ones.
      #
      # Each slot is about one core, because a camera thread analyses frames
      # as fast as it can, and every open stream costs about a fifth of a core
      # to decode whether or not it is analysed. Measured on the 10-core M5
      # with the organisers' 1080p streams, at night:
      #   all 31 open, all analysed   ~10 cores, 0.3-1.2 fps per camera,
      #                               89-95% of frames dropped, 2 per vehicle
      #   all 31 open, 2 per worker   ~10 cores (six analysed, ~6 decoding)
      #   6 open, 2 per worker        ~6 cores, ~2.2 fps per camera
      # So on this laptop the number of open streams matters as much as the
      # slots; narrow a worker with AI_WORKER_CAMERAS_1/2/3 to hold fewer.
      # Memory is no longer the limit: models are shared
      # (ailab.pipeline._shared) and each stream decodes on one thread
      # (ailab.runtime.decode_threads), ~3 GB for all 31 streams.
      AI_WORKER_MAX_CAMERAS: ${AI_WORKER_MAX_CAMERAS:-2}
      # How long a camera holds a slot before yielding to one that is waiting.
      AI_WORKER_SLICE_SECONDS: ${AI_WORKER_SLICE_SECONDS:-45}
      # The recorded fallback camera never yields its slot: when the grid
      # cannot be reached it is the feed on screen, and a camera mid-handover
      # when it is opened shows no boxes until it next gets a slot.
      AI_WORKER_PINNED: ${AI_WORKER_PINNED:-CAM-DEMO-01}
      # Cameras kept open and analysed whenever owned; empty means every
      # camera a worker owns. Every other camera is opened only while someone
      # has it on the Live ANPR screen, which puts it first in line (focus,
      # app/services/focus.py), and stays open five minutes after, unanalysed,
      # so clicking back costs the grid no new session.
      AI_WORKER_ALWAYS_ON: ${AI_WORKER_ALWAYS_ON:-}
      # ── CPU budget ──
      #
      # Total intra-op inference threads for the whole worker, divided evenly
      # across the concurrent cameras by `ailab.runtime`. Empty means
      # "cores - 2", reserving two for RTSP decode, the media gateway and the
      # browser rendering the map.
      #
      # Do NOT set AILAB_ORT_THREADS here. It is a per-model override for
      # sweeping thread counts by hand, and setting it bypasses the division —
      # which is exactly the bug this replaced: every model taking four
      # threads, times five sessions, times one pipeline per camera.
      # Per process — see the table above; 2 is the measured optimum here.
      # Leave it blank only when running ONE worker: blank means "cores − 2"
      # per process, and three of those oversubscribe the machine badly.
      AILAB_INFERENCE_BUDGET: ${AILAB_INFERENCE_BUDGET:-6}
      # OpenCV parallelises single resize/cvtColor calls. The worker already
      # has one thread per camera, so an inner pool on top of that only
      # multiplies threads against the same cores. Empty means 1 whenever more
      # than one camera runs.
      AILAB_OPENCV_THREADS: ${AILAB_OPENCV_THREADS:-}
      # ── Store and forward (ai_worker/publisher.py) ──
      # Sightings made while the bus is unreachable are held in memory and
      # overflow to this volume (a subdirectory per worker), then replayed in
      # order when it answers; what is held at shutdown is written here and
      # replayed by the next process. Bounds: AI_WORKER_SPOOL_MAX_EVENTS /
      # _MAX_BYTES in memory, AI_WORKER_SPOOL_DISK_MAX_BYTES on disk.
      AI_WORKER_SPOOL_DIR: /var/spool/contrail
    volumes:
      # Weights are fetched by a committed script and mounted, never baked into
      # an image or committed to git.
      - ./ai-lab/models:/models:ro
      # The disk tier of the event spool. A named volume, so it survives the
      # container being recreated — which is when it matters.
      - ai-worker-spool:/var/spool/contrail
      # Source mounted so the vision pipeline can be changed and restarted
      # without a rebuild — the same reason the lab does it.
      - ./services/ai-worker/ai_worker:/srv/ai_worker
      - ./ai-lab/ailab:/opt/ailab/ailab
      # Mounted for the same reason as the source: a pipeline config is a
      # tuning decision, and retuning should not need an image rebuild.
      - ./ai-lab/configs:/opt/ailab/configs:ro
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      # Healthy means "can reach the bus it publishes to". A worker with no
      # cameras assigned is idle, not broken, and restarting it would not help.
      test: ["CMD", "python", "-m", "ai_worker.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [contrail]

  # ── The other two ANPR workers — opt in with `make ai-multi` ────────
  #
  # Profile `ai-multi`, not `ai`, so `make ai` starts **one** worker on one
  # camera. That is a latency decision, not a capacity one.
  #
  # Every worker decodes its camera's full frame rate and runs the detector on
  # what it keeps, so three of them share a 10-core laptop three ways. Measured
  # on this host, same footage, only the worker count differing:
  #
  #   three workers   3.3 fps each   p90 507 ms   ~711% CPU
  #   one worker      (see below)    markedly lower latency
  #
  # Latency is what decides whether a plate box lands on the right car: the
  # overlay draws each box on the frame it was measured in, and a reading that
  # arrives late describes a car that has already moved on. One camera reading
  # promptly demonstrates the pipeline better than three reading late.
  #
  # Start all three when the demo needs cross-camera linking — a vehicle has to
  # be seen by more than one camera before there is a journey to reconstruct:
  #
  #     make ai-multi
  #
  # and drop AILAB_INFERENCE_BUDGET back to 2 when you do, so the three share
  # the machine instead of each sizing for it alone.
  ai-worker-2:
    <<: *ai-worker
    container_name: contrail-ai-worker-2
    profiles: ["ai-multi"]
    environment:
      <<: *ai-worker-env
      AI_WORKER_CAMERAS: ${AI_WORKER_CAMERAS_2:-}
      AI_WORKER_INDEX: "1"

  ai-worker-3:
    <<: *ai-worker
    container_name: contrail-ai-worker-3
    profiles: ["ai-multi"]
    environment:
      <<: *ai-worker-env
      AI_WORKER_CAMERAS: ${AI_WORKER_CAMERAS_3:-}
      AI_WORKER_INDEX: "2"

  # ── Simulator — synthetic camera fleet ──────────────────────────────
  # Replays footage into MediaMTX as real RTSP, so the platform has live
  # cameras without hardware. This is the same technique the challenge
  # sandbox uses to expose its 30+ government feeds (FAQ Q39-40).
  simulator:
    image: contrail/api:dev
    container_name: contrail-simulator
    <<: *default-restart
    command:
      ["uvicorn", "simulator.main:app", "--host", "0.0.0.0", "--port", "9100",
       "--app-dir", "/app/services/simulator"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nagarnetra}:${POSTGRES_PASSWORD:-nagarnetra_dev_pw}@postgres:5432/${POSTGRES_DB:-nagarnetra}
      SIM_VIDEO_DIR: /data/videos
      # 0 = publish only the cameras with footage pinned below. Raise it to
      # replay clips across the fleet for load testing, where synthetic video
      # is the point rather than a pretence at a live feed.
      SIM_STREAM_COUNT: ${SIM_STREAM_COUNT:-0}
      # The recorded cameras: CAM-DEMO-01, kept as the ANPR fallback when the
      # organisers' grid cannot be reached, and CAM-DEMO-02, the persons
      # watchlist's demonstration (the grid's junction cameras cannot resolve
      # a face). Cameras sharing a clip are each seeked to a different point
      # in it, so they never show the same instant.
      SIM_CAMERA_VIDEOS: ${SIM_CAMERA_VIDEOS:-CAM-DEMO-01=anpr_demo.mp4,CAM-DEMO-02=persons_demo.mp4}
      # Blank spreads cameras sharing a clip evenly across its real duration.
      SIM_OFFSET_STEP_S: ${SIM_OFFSET_STEP_S:-}
      PYTHONPATH: /app/services/simulator:/app/services/api
    ports:
      - "${SIMULATOR_HOST_PORT:-9100}:9100"
    volumes:
      - ./services/simulator:/app/services/simulator
      - ./services/api:/app/services/api
      - ./data/videos:/data/videos:ro
      # Writable: the simulator re-encodes each clip once with dense keyframes
      # so it can then stream them with `-c:v copy`. See publisher.prepare_clip.
      - ./data/prepared:/data/prepared
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks: [contrail]

  # ── Monitoring — Prometheus + Grafana (`make monitoring`) ───────────
  # Opt in with the `monitoring` profile. Prometheus scrapes the API's
  # exporter (/metrics/prometheus — the JSON /metrics is for people and the
  # load test) and MediaMTX, and evaluates infra/prometheus/rules/contrail.yml.
  # Grafana is provisioned with that Prometheus and the "Contrail — pipeline"
  # dashboard. Both listen on 127.0.0.1 only: aggregate counters still reveal
  # volume, which is not nothing in a surveillance system (docs/SECURITY.md).
  # No Alertmanager: rules are visible in Prometheus and Grafana, not paged.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: contrail-prometheus
    <<: *default-restart
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    networks: [contrail]

  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: contrail-grafana
    <<: *default-restart
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # From .env; the default is a development value, like every other here.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nagarnetra_dev_pw}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Viewers need no account on this loopback-only port; changing a
      # dashboard still needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/contrail-pipeline.json
      # Offline-capable, like the rest of the platform: no update checks, no
      # usage reporting, no plugin downloads at start.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [contrail]

networks:
  contrail:
    name: contrail-net
    driver: bridge
    # Fixed subnet so MediaMTX can grant control-API access to the internal
    # tier by CIDR rather than to the world (see infra/mediamtx/mediamtx.yml).
    # 172.31 rather than the old 172.28: the pre-rename nagarnetra-net keeps
    # 172.28, and Docker refuses two networks with overlapping pools.
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  ai-worker-spool:
  prometheus-data:
  grafana-data:
