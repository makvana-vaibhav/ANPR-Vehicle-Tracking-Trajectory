###############################################################################
# Contrail — Prometheus
#
# Scrapes the platform's own exporter (the API), the MediaMTX stream gateway,
# and itself. Everything here is reachable only on the compose network
# `contrail-net` (172.31.0.0/16); nothing is scraped across the host.
#
# Image: prom/prometheus:v3.5.0 (v3.5 LTS line). Validate with:
#   docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
#     --entrypoint promtool prom/prometheus:v3.5.0 \
#     check config /etc/prometheus/prometheus.yml
###############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Identifies this Prometheus if its data is ever federated or remote-written.
  external_labels:
    platform: contrail

rule_files:
  - /etc/prometheus/rules/*.yml

# No Alertmanager is deployed. The rules in rules/contrail.yml are still
# evaluated every 15 s, and their state (inactive / pending / firing) is
# visible at Prometheus /alerts and in Grafana's alert list — but nothing is
# routed to a person. To page someone, deploy Alertmanager with a receiver
# (email, webhook, ...) and uncomment:
#
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # The platform exporter. `/metrics` on the API returns JSON for the web UI and
  # is NOT Prometheus text — scraping it would fail every time. The exposition
  # format lives at /metrics/prometheus.
  - job_name: contrail-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['api:8000']
        labels:
          service: api

  # MediaMTX serves Prometheus text on :9998. Its auth config grants the
  # `metrics` action to 172.31.0.0/16 only, which is why this works from inside
  # contrail-net and from nowhere else.
  - job_name: mediamtx
    metrics_path: /metrics
    static_configs:
      - targets: ['mediamtx:9998']
        labels:
          service: mediamtx

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
