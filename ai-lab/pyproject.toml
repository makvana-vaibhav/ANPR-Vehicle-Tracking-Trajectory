[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nagarnetra-ailab"
version = "0.1.0"
description = "Standalone AI evaluation lab for the NagarNetra CCTV platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.scripts]
ailab = "ailab.cli:main"

[tool.setuptools.packages.find]
include = ["ailab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI-style defaults are not used here, but Field() defaults are
  "RUF012",  # mutable class attributes are intentional in the registry
  "RUF001",  # en/em dashes and arrows in prose comments are deliberate
  "N818",    # ComponentNotFound subclasses KeyError; the Error suffix would mislead
  "E501",    # long lines are prose comments; code is wrapped by hand where it matters
]

[tool.mypy]
# Run `mypy` from ai-lab/ (`make lint` and CI both do). It also checks
# services/ai-worker, which imports this package and ships in the same image —
# checking them together is what catches a mismatch between the runner and the
# sinks and crop stores the worker hands it. Run it against the worker's pinned
# dependencies (services/ai-worker/requirements.txt plus requirements-dev.txt):
# numpy's and OpenCV's stubs change between releases.
files = ["ailab", "../services/ai-worker/ai_worker"]
python_version = "3.11"
platform = "linux"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Installed, but ship no type information.
module = ["onnxruntime.*", "scipy.*", "rapidocr_onnxruntime.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The optional experiment profile (requirements-torch.txt), imported lazily and
# absent from the core environment the pipeline ships with.
module = ["torch.*", "torchvision.*", "ultralytics.*", "easyocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "models: requires downloaded model weights",
  "slow: processes real video",
]
