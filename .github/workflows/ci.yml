# ══════════════════════════════════════════════════════════════════════
#  CI — the checks `make lint` and the unit suites run locally.
#
#  Python is checked in two environments, as it ships: the API image's
#  (API, simulator, scripts) and the AI worker's (ai-lab + the worker), whose
#  numpy, OpenCV and pydantic differ. Actions are pinned to commit SHAs.
# ══════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Every service reads env_file: .env, which is gitignored; `make env`
      # creates it from the committed example the same way.
      - name: Validate every compose profile
        run: |
          cp .env.example .env
          # Secrets are generated per install; compose has no fallbacks and
          # refuses to interpolate an empty one.
          python3 scripts/gen_secrets.py --env .env
          docker compose config --quiet
          docker compose --profile ai --profile ai-multi config --quiet
          docker compose -f docker-compose.yml -f docker-compose.scale.yml config --quiet

  api-lint:
    name: API, simulator, scripts · ruff + mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install API dependencies and tooling
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Ruff (API)
        working-directory: services/api
        run: |
          ruff check .
          ruff format --check .

      - name: Ruff (AI worker, simulator, scripts)
        run: |
          ruff check services/ai-worker services/simulator scripts
          ruff format --check services/ai-worker services/simulator scripts

      # Targets come from [tool.mypy] `files`: app/ and the simulator.
      - name: mypy (API + simulator)
        working-directory: services/api
        run: mypy

  api-tests:
    name: API + simulator tests (Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # The images docker-compose.yml runs. timescaledb-ha preloads TimescaleDB
      # and carries PostGIS; migration 0001 creates the extensions.
      postgres:
        image: timescale/timescaledb-ha:pg16.14-ts2.29.2-all
        env:
          POSTGRES_DB: nagarnetra
          POSTGRES_USER: nagarnetra
          POSTGRES_PASSWORD: nagarnetra_dev_pw
        ports:
          - 5432:5432
        # Over TCP: during first-boot init the image runs a socket-only server,
        # which a plain pg_isready would already call ready.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nagarnetra -d nagarnetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nagarnetra:nagarnetra_dev_pw@localhost:5432/nagarnetra
      REDIS_URL: redis://localhost:6379/0
      # Settings with no default. Throwaway values for a throwaway database,
      # the same development samples .env.example ships; none is a secret.
      JWT_SECRET_KEY: dev_only_insecure_ci_secret_0123456789abcdef
      MINIO_ROOT_PASSWORD: nagarnetra_dev_pw
      # The suite signs in as every seeded role, each with its own password
      # (scripts/seed.py). Throwaway values for a throwaway database.
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-Throwaway-7q
      DEMO_PASSWORD_SUPERVISOR: ci-supervisor-Throwaway-7q
      DEMO_PASSWORD_OPERATOR: ci-operator-Throwaway-7q
      DEMO_PASSWORD_ANALYST: ci-analyst-Throwaway-7q
      DEMO_PASSWORD_AUDITOR: ci-auditor-Throwaway-7q
      DEMO_PASSWORD_GSRTC_INTEGRATION: ci-gsrtc-Throwaway-7q
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install API dependencies and tooling
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Migrate
        working-directory: services/api
        run: alembic upgrade head

      - name: Seed
        run: python -m scripts.seed

      # Deselected: nine tests that assert the state of the running demo stack
      # rather than of the code. Eight need the organisers' federated camera
      # grid (ten or more cameras; the seed has one), which is reached over the
      # network with credentials CI does not hold. One needs OpenSearch, MinIO
      # and MediaMTX all healthy. `make test` runs them against the live stack.
      - name: API tests
        working-directory: services/api
        env:
          PYTHONPATH: ${{ github.workspace }}/services/api:${{ github.workspace }}/services/simulator
        run: >-
          python -m pytest tests -p no:cacheprovider
          --deselect tests/test_cameras.py::TestFleetIsSeeded::test_geojson_returns_the_whole_fleet
          --deselect tests/test_cameras.py::TestFleetIsSeeded::test_fleet_spans_multiple_departments_and_vendors
          --deselect tests/test_cameras.py::TestFleetIsSeeded::test_vms_instances_cover_several_vendors
          --deselect tests/test_cameras.py::TestPagination::test_pages_do_not_overlap
          --deselect tests/test_fleet_health.py::TestFleetHealthEndpoint::test_reports_the_whole_estate
          --deselect tests/test_fleet_health.py::TestFleetHealthEndpoint::test_breaks_down_by_department_and_vendor
          --deselect tests/test_fleet_health.py::TestGapAnalysis::test_district_coverage_totals_match_the_fleet
          --deselect tests/test_fleet_health.py::TestStreamGateway::test_token_for_one_camera_cannot_open_another
          --deselect tests/test_health.py::TestReadiness::test_all_dependencies_healthy

      # No services needed, only the settings above: publisher.py uses the
      # API's logger, which loads them.
      - name: Simulator tests
        env:
          PYTHONPATH: services/simulator:services/api
        run: python -m pytest services/simulator/tests -q -p no:cacheprovider

  anpr:
    name: ai-lab + AI worker · ruff, mypy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-worker/requirements*.txt

      # As services/ai-worker/Dockerfile does it: RapidOCR goes in with
      # --no-deps, or it pulls the non-headless OpenCV over the headless one.
      # The worker's requirements are a superset of ai-lab's, at the same pins.
      - name: Install the AI worker's dependencies and tooling
        run: |
          grep -v '^rapidocr-onnxruntime' services/ai-worker/requirements.txt > "$RUNNER_TEMP/base.txt"
          grep '^rapidocr-onnxruntime' services/ai-worker/requirements.txt > "$RUNNER_TEMP/rapidocr.txt"
          python -m pip install -r "$RUNNER_TEMP/base.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/rapidocr.txt"
          python -m pip install -r services/ai-worker/requirements-dev.txt

      # Lint only: ai-lab is formatted by hand and does not enforce
      # `ruff format`. The worker's formatting is checked in api-lint.
      - name: Ruff (ai-lab)
        working-directory: ai-lab
        run: ruff check ailab tests scripts

      # Targets come from [tool.mypy] `files`: ailab/ and the AI worker.
      - name: mypy (ai-lab + AI worker)
        working-directory: ai-lab
        run: mypy

      # No weights needed: RapidOCR bundles its models in the wheel.
      - name: ai-lab tests
        working-directory: ai-lab
        run: python -m pytest -p no:cacheprovider

      - name: AI worker tests
        env:
          PYTHONPATH: services/ai-worker:ai-lab
        run: python -m pytest services/ai-worker/tests -q -p no:cacheprovider

  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
