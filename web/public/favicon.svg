<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The app's chrome tone (--chrome), so the favicon reads as part of the
       product rather than a default browser square. -->
  <rect width="32" height="32" rx="7" fill="#0D1218" />
  <!-- The contrail mark in the trail colour (--primary): the same paths as
       BrandMark.tsx's 26×18 viewBox, centred into this canvas. The trail is
       fainter than the head, as the map draws it. -->
  <g transform="translate(3 7)">
    <path d="M1 15C7 15 9 4 17 4" fill="none" stroke="#5CC8FF" stroke-width="2.4"
          stroke-linecap="round" opacity="0.6" />
    <circle cx="21" cy="4" r="3.4" fill="#5CC8FF" />
  </g>
</svg>
