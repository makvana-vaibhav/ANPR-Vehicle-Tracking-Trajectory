####################################################################
# Contrail command centre — what both servers serve.
#
# Included by the HTTP server (:80, published as 8080) and the HTTPS server
# (:8443) in nginx.conf, so the two can never drift: same headers, same
# routes, same proxies. Only TLS and HSTS differ, and they live in nginx.conf.
####################################################################

root /usr/share/nginx/html;
index index.html;

# NGINX GOTCHA, do not undo: add_header directives are inherited by a
# location block ONLY if that block declares no add_header of its own. A
# single `add_header Cache-Control` inside `location /` silently drops
# every header below for the entire app. Locations therefore use
# `expires` / `default_type` instead. Verified by asserting the headers
# are present on a real response.
#
# Operators paste plate numbers and case references; keep them out of
# third-party referer headers.
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Video (WebRTC/HLS) and map assets are same-origin or localhost only.
# Tightened further in production — see docs/SECURITY.md.
# The organisers' camera grid is an external media source: HLS playlists and
# segments are fetched by hls.js (connect-src) and played by the video
# element (media-src). Without both, the player fails with "Failed to fetch"
# and the cause is invisible in the UI.
#
# Satellite imagery is the other external dependency, and it is optional:
# the map falls back to the offline GeoJSON basemap when the tile host
# is unreachable. Esri World Imagery needs no API key.
#
# Plate crops are signed URLs on the evidence store (MINIO_PUBLIC_ENDPOINT,
# http://localhost:9000), so img-src must name it. It did not, and every
# crop — on alerts, in search, in the live feed and in reports — was
# blocked here while working under the Vite dev server, which sends no
# policy at all. Change both together.
#
# Over HTTPS the API returns crops and video on this origin instead
# (/media/, /gateway/ below), which 'self' already covers.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: http://localhost:9000 https://server.arcgisonline.com https://*.arcgisonline.com; media-src 'self' blob: http://localhost:8888 http://localhost:8000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:8000 http://localhost:8888 http://localhost:8889 https://server.arcgisonline.com https://*.arcgisonline.com; worker-src 'self' blob:" always;

gzip on;
gzip_types text/plain text/css application/json application/javascript
           application/geo+json image/svg+xml;
gzip_min_length 1024;

client_max_body_size 25m;   # camera-registry CSV bulk upload

# ── Container healthcheck ──────────────────────────────────────
location = /healthz {
    access_log off;
    # `default_type`, not `add_header`: any add_header here would cancel
    # inheritance of the server-level security headers (see the note above
    # the CSP directive).
    default_type text/plain;
    return 200 "ok\n";
}

# ── API proxy ──────────────────────────────────────────────────
location /api/ {
    # No trailing slash: the API's own routers are mounted under /api/v1,
    # so the prefix must be forwarded rather than stripped. With a slash
    # here, a same-origin deployment (VITE_API_BASE_URL empty) 404s on
    # every call while the split-origin dev setup keeps working — the kind
    # of difference that only shows up in production.
    proxy_pass http://nagarnetra_api;
    proxy_http_version 1.1;
    # $http_host, not $host: it keeps the port, and the API builds the
    # browser's origin from it for media URLs over HTTPS
    # (app/core/public_origin.py) — https://localhost, without :8443,
    # would point at nothing.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # The audit trail records the operator's source address; without
    # this the API would log every action as coming from nginx.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

# ── WebSocket: live event and alert stream ─────────────────────
location /ws/ {
    proxy_pass http://nagarnetra_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # wss:// in, so the crop URLs in the feed point at this origin too.
    proxy_set_header X-Forwarded-Proto $scheme;
    # An idle alert feed must not be culled; the client reconnects with
    # backoff, but a needless drop is a gap in the operator's awareness.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── Evidence images: the object store, under this origin ───────
# Signed crop and face URLs over HTTPS (app/core/public_origin.py). Read
# only: GET (and HEAD), never a write. The signature is the capability, and
# it is checked by MinIO against the host it was signed for — the internal
# `minio:9000`, which is therefore the Host sent here. The path and query are
# forwarded byte for byte from $request_uri, because SigV4 signs them exactly.
location /media/ {
    limit_except GET { deny all; }
    if ($contrail_media_uri = "") { return 404; }
    set $contrail_minio "minio:9000";
    proxy_pass http://$contrail_minio$contrail_media_uri;
    proxy_http_version 1.1;
    proxy_set_header Host "minio:9000";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
}

# ── Live video: the stream gateway, under this origin ──────────
# WHEP offers only. One POST of an SDP offer to `<path>/whep`, non-trickle, is
# all the player does; anything broader (WHIP, the API, a PATCH) stays shut
# even though MediaMTX would now refuse it too (it asks the API about every
# publish and read — app/routers/gateway_auth.py).
#
# The query string is forwarded: it carries `?token=`, the camera-scoped
# stream token MediaMTX checks. A variable in proxy_pass replaces the request
# URI, args included, so they are appended explicitly.
location ~ ^/gateway/webrtc/(?<contrail_mtx_path>[A-Za-z0-9._~-]+(?:/[A-Za-z0-9._~-]+)*)/whep$ {
    limit_except POST { deny all; }
    set $contrail_mediamtx_webrtc "mediamtx:8889";
    proxy_pass http://$contrail_mediamtx_webrtc/$contrail_mtx_path/whep$is_args$args;
    # A refused token answers 401 with `WWW-Authenticate: Basic`; on this
    # origin the browser would turn that into a password dialog no operator
    # can answer. The player reports the refusal itself.
    proxy_hide_header WWW-Authenticate;
    # The session URL MediaMTX returns, kept under this prefix.
    proxy_redirect ~^/(.*)$ /gateway/webrtc/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 30s;
}

# HLS reads (playlists, segments, low-latency parts). Unbuffered: LL-HLS
# holds a playlist request open until the next part exists, and a buffering
# proxy would add that wait again.
location ~ ^/gateway/hls/(?<contrail_hls_rest>[A-Za-z0-9._~/-]+)$ {
    limit_except GET { deny all; }
    set $contrail_mediamtx_hls "mediamtx:8888";
    proxy_pass http://$contrail_mediamtx_hls/$contrail_hls_rest$is_args$args;
    # See the WHEP block: no browser password dialog for a refused token.
    proxy_hide_header WWW-Authenticate;
    # MediaMTX first answers with a cookie-check redirect to an absolute path
    # (`/cam/index.m3u8?cookieCheck=1`); unrewritten, the browser follows it out
    # of this prefix and gets the SPA's index.html instead of a playlist.
    proxy_redirect ~^/(.*)$ /gateway/hls/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 30s;
}

# ── Static assets — content-hashed by Vite, safe to cache hard ──
location /assets/ {
    # `expires` alone. Adding a Cache-Control add_header here would drop
    # every security header for hashed assets.
    expires 1y;
    access_log off;
}

# The federated grid is no longer proxied here. Its media now goes through
# the API (`/api/v1/grid/...`), because the grid requires a login session
# and nginx cannot perform one — see app/routers/grid_media.py. Requests
# reach it via the /api/ block above.


# ── SPA fallback ───────────────────────────────────────────────
location / {
    try_files $uri $uri/ /index.html;
    # index.html must never be cached, or operators keep an old bundle
    # after a deployment. `expires -1` emits the no-cache headers WITHOUT
    # using add_header — which would silently disable CSP on the app route.
    expires -1;
}
