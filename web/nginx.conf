####################################################################
# NagarNetra command centre — nginx
#
# Serves the SPA and reverse-proxies the API on the same origin, so the
# browser makes no cross-origin requests and WebSockets need no special
# CORS handling. One origin also means one TLS certificate in production.
#
# Two servers, one application (nginx/contrail-app.conf, included by both):
#   :80    plain HTTP — published as 8080, the demo's address, unchanged
#   :8443  HTTPS — certificate from /etc/nginx/tls (mounted, e.g. mkcert) or
#          generated self-signed at container start (docker/30-contrail-tls.sh)
####################################################################

upstream nagarnetra_api {
    server api:8000;
    keepalive 32;
}

# The evidence and video proxies (nginx/contrail-app.conf) name their
# upstreams through variables, so they are resolved per request by Docker's
# DNS rather than once at start-up: nginx refuses to start at all when an
# upstream named in a static `server` line cannot be resolved, and MinIO or
# MediaMTX being down must cost the images and video, not the whole web tier.
resolver 127.0.0.11 valid=30s ipv6=off;

# `/media/<bucket>/<key>?<signature>` → `/<bucket>/<key>?<signature>`, taken
# from the raw request line so the signed path and query reach MinIO exactly as
# signed. Empty when the request is not of that shape.
map $request_uri $contrail_media_uri {
    "~^/media(?<rest>/[a-z0-9][a-z0-9.-]{1,62}/[^?#]+(?:\?[^#]*)?)$" $rest;
    default "";
}

# HSTS is per host, not per port. Sent for `localhost` or a bare IP it would
# make the browser upgrade the demo's own http://localhost:8080 to https and
# break it, so it is withheld there and sent for real hostnames only. An empty
# value makes add_header send nothing.
map $host $contrail_hsts {
    default "max-age=31536000";
    localhost "";
    "~^[0-9.]+$" "";
    "~^\[" "";
    "~:" "";
}

server {
    listen 80;
    # Dual-stack: the container healthcheck and any IPv6-first resolver reach
    # this over ::1. nginx's own ipv6 entrypoint script skips files it does not
    # recognise, so bind it explicitly here.
    listen [::]:80;
    server_name _;

    include /etc/nginx/contrail/app.conf;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    # Linked at start-up by docker/30-contrail-tls.sh to the mounted
    # certificate, or to one it generated. See docs/SECURITY.md §6.
    ssl_certificate     /etc/nginx/tls-active/cert.pem;
    ssl_certificate_key /etc/nginx/tls-active/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:contrail_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Only here: HSTS on a plain-HTTP response is ignored by browsers, and
    # promising HTTPS from the HTTP server would be a lie.
    add_header Strict-Transport-Security $contrail_hsts always;

    include /etc/nginx/contrail/app.conf;
}
